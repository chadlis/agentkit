[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "agentkit"
version = "0.0.0"
description = "A reference kit that runs a free-text agent, counts its runs, and exports them for Hypotrail's import agent."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
agentkit = "agentkit.cli:main"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "pyyaml==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
