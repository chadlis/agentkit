name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      # Offline: no secret is passed, so no live model call can run here (AGENTS.md).
      - run: uv run --locked pytest
      # Only the reviewed public relay source is checked online.
      - run: uv run --locked pytest -q tests/test_relayed_sources.py
        env:
          AGENTKIT_VERIFY_RELAYED_SOURCES: "1"
